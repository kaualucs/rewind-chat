<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rewind Chat</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="app-header">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="26" height="26">
        <defs>
          <linearGradient id="nfMark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f9a7f2"/>
            <stop offset="0.55" stop-color="#e863e0"/>
            <stop offset="1" stop-color="#b13dba"/>
          </linearGradient>
        </defs>
        <path d="M24 76 L24 24 L76 76 L76 24"
              fill="none" stroke="url(#nfMark)" stroke-width="12"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <div class="header-text">
      <h1 class="brand-name">Rewind<span class="brand-accent"> Chat</span></h1>
      <span class="brand-by">por Next Fit</span>
    </div>
  </header>

  <main class="app-main">
    <label class="field-label" for="linkInput">Link do atendimento</label>
    <input type="text" id="linkInput" class="link-input" placeholder="Cole aqui o link da conversa" />

    <label class="field-label">Tipo de resumo</label>
    <div class="segmented" id="typeSelector" role="tablist">
      <button class="seg-btn active" data-type="breve" role="tab">Breve</button>
      <button class="seg-btn" data-type="normal" role="tab">Normal</button>
      <button class="seg-btn" data-type="detalhado" role="tab">Detalhado</button>
    </div>

    <button id="generateBtn" class="btn-primary btn-generate">
      <span class="btn-label">Gerar resumo</span>
    </button>

    <div id="status" class="status-area hidden"></div>

    <section id="resultCard" class="result-card hidden">
      <div class="result-header">
        <span id="resultTag" class="result-tag">Resumo</span>
        <button id="copyBtn" class="copy-btn" title="Copiar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copiar</span>
        </button>
      </div>
      <div id="resultText" class="result-text"></div>
    </section>
  </main>

  <script src="config.local.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
